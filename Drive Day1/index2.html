<!doctype html>
<html>

<head>
  <title>Hello World!</title>
  <style>
    #outerDiv {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>

<body>
  <div id="outerDiv">
    <span id="display">Count: </span>
    <div id="innerDiv">
      <button id="incBtn">Increment</button>
      <button id="decBtn">Decrement</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>
</body>

</html>
<script>
  function createCounter() {
    let count = 0; // Private variable - only accessible through closure

    return {
      increment: function () {
        count++;
      },
      decrement: function () {
        count--;
      },
      reset: function () {
        count = 0;
      },
      getValue: function () {
        return count;
      },
    };
  }

  const res = createCounter();

  const incBtn = document.getElementById("incBtn");
  const decBtn = document.getElementById("decBtn");
  const resetBtn = document.getElementById("resetBtn");
  const display = document.getElementById("display");

  // Set initial display value
  display.textContent = `Count: ${res.getValue()}`;

  incBtn.addEventListener("click", () => {
    res.increment();
    display.textContent = `Count: ${res.getValue()}`;
  });

  decBtn.addEventListener("click", () => {
    res.decrement();
    display.textContent = `Count: ${res.getValue()}`;
  });

  resetBtn.addEventListener("click", () => {
    res.reset();
    display.textContent = `Count: ${res.getValue()}`;
  });
</script>
